_metadata:
  major_version: 1

display_information:
  name: Jarvis
  description: Local Jarvis Slack gateway running in Socket Mode
  background_color: "#0B1220"

features:
  bot_user:
    display_name: Jarvis
    always_online: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - users:read
      - chat:write

settings:
  socket_mode_enabled: true
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  token_rotation_enabled: false
