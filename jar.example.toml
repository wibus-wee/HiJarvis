[agent]
provider = "openai"
model = "gpt-4o-mini"
system_prompt = """
You are Jarvis, a concise local coding assistant.
Use tools when they materially improve accuracy.
"""
thinking_level = "minimal"
# Optional. Request timeout for each prompt execution attempt.
request_timeout_ms = 120000
# Optional. Number of retries after the first failed attempt.
retry_attempts = 5
# Optional. Backoff starts at this delay and grows by multiplier.
retry_initial_delay_ms = 1000
retry_backoff_multiplier = 2
# Optional. Upper bound for retry wait and provider-suggested retry delays.
retry_max_delay_ms = 30000

[entities.jarvis]
# Optional. Human-readable name shown by surfaces when addressing this entity.
display_name = "Jarvis"
# Optional. Override the base system prompt for this entity only.
# system_prompt = "You are Jarvis, a focused personal assistant."

[entities.pm]
# Optional. A second entity that can be bound to its own real platform identities.
display_name = "PM Jarvis"
# Optional. Override the base system prompt for this entity only.
# system_prompt = "You are PM Jarvis, a product-focused assistant."

[agent.compaction]
# Optional. Toggle auto-compaction for long-running sessions.
enabled = true
# Optional. Trigger compaction when estimated tokens exceed this fraction of the context window.
trigger_ratio = 0.9
# Optional. Target fraction of the context window after compaction.
budget_ratio = 0.9
# Optional. Max output tokens for the summary call.
summary_max_tokens = 1024

[provider.openai]
# Optional. When omitted, pi-ai falls back to provider environment variables.
api_key = "replace-me"
# Optional. Useful for OpenAI-compatible gateways, local models, or proxies.
base_url = "https://api.openai.com/v1"

# Custom OpenAI-compatible provider example. Select it with:
#   [agent]
#   provider = "local-openai"
#   model = "llama-3.1-8b"
#
# [provider.local-openai]
# api = "openai-completions"
# api_key = "local-key"
# base_url = "http://localhost:11434/v1"
#
# [provider.local-openai.models."llama-3.1-8b"]
# name = "Llama 3.1 8B"
# context_window = 131072
# max_tokens = 32768
# vision = true
# tool_call = true
# reasoning = false

# Custom Anthropic-compatible provider example. Select it with:
#   [agent]
#   provider = "proxied-anthropic"
#   model = "claude-proxy"
#
# [provider.proxied-anthropic]
# api = "anthropic-messages"
# api_key = "replace-me"
# base_url = "https://anthropic-proxy.example.test"
#
# [provider.proxied-anthropic.models.claude-proxy]
# name = "Claude Proxy"
# context_window = 200000
# max_tokens = 8192
# vision = true
# tool_call = true
# reasoning = true

[platform.slack.identities.slack_main]
# Required. Bind this real Slack bot identity to one entity.
entity = "jarvis"
# Optional. Slack bot token. Environment variables may still override this process-wide.
bot_token = "xoxb-replace-me"
# Optional. Slack app-level token for Socket Mode (xapp-...).
app_token = "xapp-replace-me"
# Optional. Slack signing secret. Environment variables may still override this process-wide.
signing_secret = "replace-me"
# Optional. Bootstrap lookback window for a channel scope that has not seen a reply from this identity yet.
context_lookback_minutes = 15
# Optional. Maximum number of top-level channel messages injected for each channel-scope turn.
context_message_limit = 12

[platform.slack.identities.slack_pm]
# Optional. A second real Slack bot identity bound to a different entity.
entity = "pm"
bot_token = "xoxb-replace-me-2"
app_token = "xapp-replace-me-2"
signing_secret = "replace-me-2"
context_lookback_minutes = 15
context_message_limit = 12

[platform.telegram.identities.telegram_main]
# Required. Bind this real Telegram bot identity to one entity.
entity = "jarvis"
# Optional. Telegram bot token.
bot_token = "123456:replace-me"
# Optional. Restrict this bot to a fixed set of chat ids.
allowed_chat_ids = [123456789]
# Optional. Restrict this bot to a fixed set of Telegram usernames.
allowed_usernames = ["wibus"]

[platform.telegram.identities.telegram_pm]
# Optional. A second real Telegram bot identity bound to a different entity.
entity = "pm"
bot_token = "654321:replace-me"
allowed_chat_ids = [987654321]
allowed_usernames = ["wibus"]

[logging]
# Optional. Summary log verbosity: error, warn, info, or debug.
level = "info"
# Optional. Mirror runtime logs to stderr for local development.
stderr = true
# Optional. Persist summary logs to a file, relative to this config file.
file_path = ".jar/logs/runtime.log"

[skills]
# Optional. Disable all skill discovery and prompt injection.
enabled = true
# Optional. Skill roots. Relative paths resolve from this config file.
roots = [".jarvis/skills", "~/.jarvis/skills"]
# Optional. Maximum directory traversal depth for skill discovery.
max_scan_depth = 6
# Optional. Maximum number of SKILL.md files loaded into the catalog.
max_skills = 2000
# Optional. Maximum catalog characters appended to the system prompt.
max_catalog_chars = 12000
# Optional. Maximum characters injected from one SKILL.md body per turn.
max_body_chars = 20000

[memory]
# Optional. Disable all long-term memory tools for every entity.
enabled = true
# Optional. Active memory provider name.
provider = "filesystem"

[memory.providers.filesystem]
# Optional. Filesystem root used by the default provider. Relative to this config file.
root_dir = ".jar/memory"

# Example external provider module:
# [memory.providers.custom]
# module = "./plugins/custom-memory.ts"
# endpoint = "https://memory.example.test"
# namespace = "jarvis-memory"

[tools]
workspace_root = "."
max_file_bytes = 32768
command_timeout_ms = 30000
max_command_output_bytes = 32768
web_request_timeout_ms = 30000
max_web_response_bytes = 65536

[sessions]
# Optional. Session storage root, relative to the config file when not absolute.
root_dir = ".jar/sessions"

# ── memory-workspace plugin ──────────────────────────────────────────────────
# Enables MEMORY.md-style persistent memory:
#   - MEMORY.md is automatically injected into the system prompt on every startup
#   - Agent can read/write notes/ files and update MEMORY.md via workspace tools
#   - Coexists with the JSONL memory system above
#
# [[plugins]]
# module = "./packages/jar-core/src/memory/workspace-plugin.ts"
#
# [plugins.config]
# dir = ".jar/memory"   # Optional. Defaults to ".jar/memory" (same root as JSONL memory)

[[plugins]]
module = "@hijarvis/jar-plugin-slack"

[[plugins]]
module = "@hijarvis/jar-plugin-telegram"
